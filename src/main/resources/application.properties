spring.application.name=nexvia-backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/nexvia
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
nexvia.jwt.secret=${JWT_SECRET:nexvia-dev-secret-key-que-tiene-al-menos-256-bits-de-largo-para-hmac}
nexvia.jwt.expiration-ms=86400000
nexvia.jwt.refresh-expiration-ms=604800000

# CORS
nexvia.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# Cancelación
nexvia.cancelacion.ventana-gratis-minutos=30
nexvia.cancelacion.penalidad-porcentaje=10

# Server
server.port=8080
